name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token can read the code and push packages,
# nothing else.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    # A real PostgreSQL for the tests, started next to the job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payments
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d payments"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: payments
      DB_USER: payments
      DB_PASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build-scan-push:
    needs: test            # only runs if the tests pass
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t "$IMAGE:${{ github.sha }}" .

      # Fails the pipeline if the image has a HIGH or CRITICAL vulnerability
      # that already has a fix. The image is pushed only after this passes.
      #
      # v0.35.0 is the version published as safe after the March 2026
      # trivy-action tag hijack. Tags can be moved, so production teams pin
      # actions to the full commit SHA shown on the action's releases page.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
